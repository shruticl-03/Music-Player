<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/bfea75c84c.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="music-player">
            <nav>
                <div class="circle" onclick="prevSong()">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>

            <img src="media/thumbnail1.png" class="song-img" alt="Song Thumbnail">
            <h1 id="song-title">Yeh Raaten Yeh Mausam</h1>
            <p id="song-artist">Sanam, Simran Sehgal</p>

            <audio id="song">
                <source src="media/Yeh Raaten Yeh Mausam.mp3" type="audio/mpeg">
            </audio>

            <input type="range" id="progress" value="0">

            <div class="controls">
                <div onclick="prevSong()">
                    <i class="fa-solid fa-backward"></i>
                </div>
                <div onclick="playPause()">
                    <i class="fa-solid fa-play" id="ctrlIcon"></i>
                </div>
                <div onclick="nextSong()">
                    <i class="fa-solid fa-forward"></i>
                </div>
            </div>

        </div>
    </div>

    <script>
        let progress = document.getElementById("progress");
        let song = document.getElementById("song");
        let ctrlIcon = document.getElementById("ctrlIcon");
        let songTitle = document.getElementById("song-title");
        let songArtist = document.getElementById("song-artist");
        let songImg = document.querySelector(".song-img");

        // Songs list
        let songs = [
            {
                name: "Yeh Raaten Yeh Mausam",
                artist: "Sanam, Simran Sehgal",
                img: "media/thumbnail1.png",
                src: "media/Yeh Raaten Yeh Mausam.mp3"
            },
            {
                name: "Baarish",
                artist: "Shashaa Tirupati",
                img: "media/Half-Girlfriend.jpg",
                src: "media/Baarish.mp3"
            },
            {
                name: "Agar Tum Saath Ho",
                artist: "Arjith Singh and Alka Yagnik",
                img: "media/tum sath.jpeg",
                src: "media/Agar Tum Saath Ho.mp3"
            }
        ];

        let currentSong = 0;

        // Load song function
        function loadSong(index) {
            song.src = songs[index].src;
            songTitle.textContent = songs[index].name;
            songArtist.textContent = songs[index].artist;
            songImg.src = songs[index].img;
            song.load();
            song.play();
            ctrlIcon.classList.remove("fa-play");
            ctrlIcon.classList.add("fa-pause");
        }

        // Play/Pause
        function playPause() {
            if (song.paused) {
                song.play();
                ctrlIcon.classList.remove("fa-play");
                ctrlIcon.classList.add("fa-pause");
            } else {
                song.pause();
                ctrlIcon.classList.remove("fa-pause");
                ctrlIcon.classList.add("fa-play");
            }
        }

        // Next Song
        function nextSong() {
            currentSong++;
            if (currentSong >= songs.length) {
                currentSong = 0;
            }
            loadSong(currentSong);
        }

        // Previous Song
        function prevSong() {
            currentSong--;
            if (currentSong < 0) {
                currentSong = songs.length - 1;
            }
            loadSong(currentSong);
        }

        // Progress bar update
        song.addEventListener('timeupdate', () => {
            if (!isNaN(song.duration)) {
                progress.value = song.currentTime;
                progress.max = song.duration;
            }
        });

        // Seek through the song
        progress.oninput = function () {
            song.currentTime = progress.value;
        };

        // When song ends automatically go to next
        song.addEventListener('ended', nextSong);

    </script>
</body>

</html>
