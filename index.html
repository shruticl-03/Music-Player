<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/bfea75c84c.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="music-player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <img src="media/thumbnail1.png" class="song-img">
            <h1>Yeh Raaten Yeh Mausam</h1>
            <p>Sanam, Simran Sehgal</p>
            <audio controls>
                <source src="media/Yeh Raaten Yeh Mausam.mp3" type="audio/mpeg">
            </audio>
        </div>

    </div>

</body>

</html>
